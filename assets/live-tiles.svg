<svg xmlns="http://www.w3.org/2000/svg" width="610" height="310" viewBox="0 0 610 310" role="img" aria-label="Animated Windows Phone style live tiles" xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .tile { transform-box: fill-box; transform-origin: center; animation: flip 8s ease-in-out infinite; }
  .a { animation: faceA 8s linear infinite; }
  .b { animation: faceB 8s linear infinite; }
  text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 300; fill: #fff; }
  .big { font-size: 28px; }
  .small { font-size: 21px; }
  @keyframes flip {
    0%, 38% { transform: scaleY(1); }
    44% { transform: scaleY(0.02); }
    50%, 88% { transform: scaleY(1); }
    94% { transform: scaleY(0.02); }
    100% { transform: scaleY(1); }
  }
  @keyframes faceA { 0%, 43.9% { opacity: 1; } 44%, 94% { opacity: 0; } 94.1%, 100% { opacity: 1; } }
  @keyframes faceB { 0%, 43.9% { opacity: 0; } 44%, 94% { opacity: 1; } 94.1%, 100% { opacity: 0; } }
</style>
<rect width="610" height="310" rx="6" fill="#000"/>
<g class="tile" style="animation-delay:-0.0s">
<rect x="10" y="10" width="290" height="140" fill="#1BA1E2"/>
<text class="a big" x="22" y="136" style="animation-delay:-0.0s">Windows Phone 8.1</text>
<text class="b big" x="22" y="136" style="animation-delay:-0.0s">Silverlight + WinRT</text>
</g>
<g class="tile" style="animation-delay:-1.3s">
<rect x="310" y="10" width="140" height="140" fill="#D80073"/>
<text class="a small" x="322" y="136" style="animation-delay:-1.3s">XAML</text>
<text class="b small" x="322" y="136" style="animation-delay:-1.3s">Visual Studio 2015</text>
</g>
<g class="tile" style="animation-delay:-2.6s">
<rect x="460" y="10" width="140" height="140" fill="#A4C400"/>
<text class="a small" x="472" y="136" style="animation-delay:-2.6s">Lumia</text>
<text class="b small" x="472" y="136" style="animation-delay:-2.6s">Nokia 630</text>
</g>
<g class="tile" style="animation-delay:-0.7s">
<rect x="10" y="160" width="140" height="140" fill="#FA6800"/>
<text class="a small" x="22" y="286" style="animation-delay:-0.7s">W10M</text>
<text class="b small" x="22" y="286" style="animation-delay:-0.7s">UWP</text>
</g>
<g class="tile" style="animation-delay:-2.0s">
<rect x="160" y="160" width="140" height="140" fill="#0050EF"/>
<text class="a small" x="172" y="286" style="animation-delay:-2.0s">Unlock</text>
<text class="b small" x="172" y="286" style="animation-delay:-2.0s">Interop</text>
</g>
<g class="tile" style="animation-delay:-3.3s">
<rect x="310" y="160" width="290" height="140" fill="#00ABA9"/>
<text class="a big" x="322" y="286" style="animation-delay:-3.3s">Retro ports</text>
<text class="b big" x="322" y="286" style="animation-delay:-3.3s">512 MB of RAM</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>